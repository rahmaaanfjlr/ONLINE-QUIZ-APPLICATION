<!DOCTYPE html>
<html>
<head>
<title>Quiz</title>
<style>body{text-align:center;font-family:Arial}button{margin:5px;padding:8px}</style>
</head>
<body>
<h1>Online Quiz</h1>
<h3 id="high"></h3>
<h2 id="q"></h2>
<div id="opt"></div>
<button onclick="next()">Next</button>
<button onclick="submit()">Submit</button>
<h2 id="result"></h2>

<script>
let qs=[
["HTML stands for?",["Hyper Text Markup Language","High Text","Home Text","None"],0],
["CSS is used for?",["Styling","Programming","Database","None"],0],
["JS is used for?",["Interaction","Styling","Database","None"],0]
];
let n=0,s=0,a=-1;

function show(){
 q.innerHTML=qs[n][0];
 opt.innerHTML=qs[n][1].map((x,i)=>
 "<button onclick='a="+i+"'>"+x+"</button>").join("");
}
function next(){
 if(a==qs[n][2])s++;
 a=-1;
 if(n<qs.length-1){n++;show();}
}
function submit(){
 if(a==qs[n][2])s++;
 result.innerHTML="Score: "+s+"/"+qs.length;
 let h=localStorage.high||0;
 if(s>h)localStorage.high=s,h=s;
 high.innerHTML="High Score: "+h;
}
high.innerHTML="High Score: "+(localStorage.high||0);
show();
</script>
</body>
</html>
